services:
  lightning.media_helper:
    class: '\Drupal\lightning_media\MediaHelper'
    arguments:
      - '@entity_type.manager'

  lightning_media.route_subscriber:
    class: '\Drupal\lightning_media\Routing\RouteSubscriber'
    tags:
      - { name: event_subscriber }

  Drupal\lightning_media\Hook\LightningMediaHooks:
    class: Drupal\lightning_media\Hook\LightningMediaHooks
    autowire: true
    arguments:
      - '@entity_display.repository'
      - '@entity_field.manager'
      - '@entity_type.manager'
      - '@config.factory'
      - '@current_route_match'
      - '@request_stack'
      - '@module_handler'
      - '@config.installer'
